<div class="container mt-5">
  <div class="row justify-content-md-center">
    <div class="col-md-4">
      @if (erreur) {
        <div class="alert alert-danger"><strong>Nom d'utilisateur ou mot de passe incorrect.</strong></div>
      }
      <h2>Connexion</h2>
      <form (ngSubmit)="onLoggedin()">
        <div class="form-group">
          <label for="username">Nom utilisateur :</label>
          <input id="username" type="text" name="username" class="form-control" [(ngModel)]="user.username" required>
        </div>
        <div class="form-group mt-2">
          <label for="password">Mot de passe :</label>
          <input id="password" type="password" name="password" class="form-control" [(ngModel)]="user.password" required>
        </div>
        <button type="submit" class="btn btn-primary mt-3">Connexion</button>
      </form>
    </div>
  </div>
</div>
